server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS. 'set' + переменная заставляет nginx
    # резолвить имя в момент запроса, а не при старте.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /api {
        set $upstream http://backend:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}