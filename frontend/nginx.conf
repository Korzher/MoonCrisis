server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Запросы к API проксируем на Go-бэкенд
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # SPA: любой путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
